[package]
name = "haloid-licence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Haloid licence keys: the format, and checking one offline"

[lints]
workspace = true

[features]
# Signing, for the keygen and for tests. The server never needs it.
sign = []

[dependencies]
haloid-core = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
haloid-licence = { path = ".", features = ["sign"] }

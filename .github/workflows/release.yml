# A release: on a tag `v<version>`, build the static Linux binary and the
# container images, sign a manifest for each, and publish them as a GitHub
# release. Installed Haloids find it at /releases/latest and check the
# signatures against the release keys compiled into them; the signing key
# is the repository secret HALOID_RELEASE_SIGNING_KEY.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  TARGET: x86_64-unknown-linux-musl
  IMAGE: ghcr.io/${{ github.repository_owner }}/haloid
  UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/haloid-updater

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $crate"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # A version with a pre-release part is published as a pre-release,
          # which /releases/latest, and so no installed Haloid, ever offers.
          case "$version" in *-*) echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV" ;; esac

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2

      - name: The binary, static, with the frontend inside
        run: |
          cargo build --release --locked --target "$TARGET" -p haloid-server --features embed-frontend
          mkdir dist
          cp "target/$TARGET/release/haloid-server" "dist/haloid-server-$TARGET"
          strip "dist/haloid-server-$TARGET"
          "dist/haloid-server-$TARGET" --version | grep -q "^haloid-server $VERSION community $TARGET$"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=haloid
          cache-to: type=gha,mode=max,scope=haloid
      - name: The updater sidecar's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.updater
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ env.VERSION }},${{ env.UPDATER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Signed manifests
        env:
          HALOID_RELEASE_SIGNING_KEY: ${{ secrets.HALOID_RELEASE_SIGNING_KEY }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cargo build --release --locked -p haloid-release --features sign --bin haloid-release-sign
          sign=target/release/haloid-release-sign
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          $sign --file "dist/haloid-server-$TARGET" --version "$VERSION" --edition community \
            --target "$TARGET" --url "$base/download/$GITHUB_REF_NAME/haloid-server-$TARGET" \
            --notes-url "$base/tag/$GITHUB_REF_NAME" \
            > "dist/haloid-server-community-$TARGET.manifest"
          $sign --image "$IMAGE@$DIGEST" --version "$VERSION" --edition community \
            --notes-url "$base/tag/$GITHUB_REF_NAME" \
            > dist/haloid-image-community.manifest

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          Haloid $VERSION.

          - Binary: \`haloid-server-$TARGET\` (static, Linux x86_64)
          - Image: \`$IMAGE:$VERSION\`
          - Updater sidecar: \`$UPDATER_IMAGE:$VERSION\`

          An installed Haloid offers this under Admin → Updates.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Haloid $VERSION" --notes-file notes.md $PRERELEASE

# A release: on a tag `v<version>`, build the static Linux binary and the
# container images, sign a manifest for each, and publish them as a GitHub
# release. Installed Haloids find it at /releases/latest and check the
# signatures against the release keys compiled into them.
#
# Two jobs, so the signing key (the secret HALOID_RELEASE_SIGNING_KEY) never
# reaches a runner that ran third-party code: `build` uses third-party
# actions and sees no secrets; `publish` uses only GitHub's own actions,
# builds the signer itself without the shared cache, and signs what `build`
# handed over. Every action is pinned to a commit; the tag is a comment.
name: Release

on:
  push:
    tags: ["v*"]

env:
  TARGET: x86_64-unknown-linux-musl
  IMAGE: ghcr.io/${{ github.repository_owner }}/haloid
  UPDATER_IMAGE: ghcr.io/${{ github.repository_owner }}/haloid-updater

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The tag matches the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $crate"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.TARGET }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: The binary, static, with the frontend inside
        run: |
          cargo build --release --locked --target "$TARGET" -p haloid-server --features embed-frontend
          mkdir dist
          cp "target/$TARGET/release/haloid-server" "dist/haloid-server-$TARGET"
          strip "dist/haloid-server-$TARGET"
          "dist/haloid-server-$TARGET" --version | grep -q "^haloid-server $VERSION community $TARGET$"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary
          path: dist/
          if-no-files-found: error

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=haloid
          cache-to: type=gha,mode=max,scope=haloid
      - name: The updater sidecar's image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.updater
          push: true
          tags: ${{ env.UPDATER_IMAGE }}:${{ env.VERSION }},${{ env.UPDATER_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary
          path: dist/

      # Built here, from the tagged source, with the runner's own toolchain
      # and no cache another job could have written.
      - name: The signer
        run: cargo build --release --locked -p haloid-release --features sign --bin haloid-release-sign

      - name: Signed manifests
        env:
          HALOID_RELEASE_SIGNING_KEY: ${{ secrets.HALOID_RELEASE_SIGNING_KEY }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no image digest from the build"; exit 1 ;; esac
          sign=target/release/haloid-release-sign
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          $sign --file "dist/haloid-server-$TARGET" --version "$VERSION" --edition community \
            --target "$TARGET" --url "$base/download/$GITHUB_REF_NAME/haloid-server-$TARGET" \
            --notes-url "$base/tag/$GITHUB_REF_NAME" \
            > "dist/haloid-server-community-$TARGET.manifest"
          $sign --image "$IMAGE@$DIGEST" --version "$VERSION" --edition community \
            --notes-url "$base/tag/$GITHUB_REF_NAME" \
            > dist/haloid-image-community.manifest

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A version with a pre-release part is published as a pre-release,
          # which /releases/latest, and so no installed Haloid, ever offers.
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          cat > notes.md <<NOTES
          Haloid $VERSION.

          - Binary: \`haloid-server-$TARGET\` (static, Linux x86_64)
          - Image: \`$IMAGE:$VERSION\`
          - Updater sidecar: \`$UPDATER_IMAGE:$VERSION\`

          An installed Haloid offers this under Admin → Updates.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Haloid $VERSION" --notes-file notes.md $prerelease
